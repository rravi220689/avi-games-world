    container_name: avi-games-world-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - DB_NAME=space_car_racing_db
      - DB_USER=appadmin
      - DB_PASSWORD=AppPgStrong@2026
      - DB_HOST=160.191.14.69
      - DB_PORT=5433
      - CONN_MAX_AGE=600
      - SECRET_KEY=django-insecure-avi-games-world-prod-secret-key-2026!
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
